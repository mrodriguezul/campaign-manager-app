services:
  db:
    image: postgres:16-alpine
    container_name: campaign-manager-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campaign_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - campaign-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campaign_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campaign-manager-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campaign_manager
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    command: >
      sh -c "pnpm run start:prod"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - campaign-network

volumes:
  postgres_data:
    driver: local

networks:
  campaign-network:
    driver: bridge