version: 2.1
jobs:
  build_and_test:
    docker:
      - image: cimg/node:20.19
      - image: postgres:16-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campaign_manager_test
    steps:
      - checkout
      - run:
          command: corepack enable && corepack prepare pnpm@9.15.9 --activate
          name: Install pnpm
      - run:
          command: pnpm install --dir backend --frozen-lockfile
          name: Install backend dependencies
      - run:
          command: pnpm --dir backend run test
          name: Run tests
      - run:
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
          name: Wait for PostgreSQL
      - run:
          command: pnpm --dir backend run test:e2e
          environment:
            NODE_ENV: test
            POSTGRES_HOST: localhost
            POSTGRES_PORT: "5432"
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: campaign_manager_test
            JWT_SECRET: super-secret-test
            GEMINI_API_KEY: mock-api-key
          name: Run E2E tests
      - run:
          command: pnpm --dir backend run build
          name: Build app
      - persist_to_workspace:
          root: ~/project
          paths: .
workflows:
  build_test_deploy: # this can be any name you choose
    jobs:
      - build_and_test
